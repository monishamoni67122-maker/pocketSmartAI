{% extends "base.html" %}
{% block title %}Login — {{ app_name }}{% endblock %}

{% block content %}
<div class="container">
  <div class="form-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to access your dashboard and history</p>

    {% if error %}
    <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required placeholder="demo" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p style="text-align:center; margin-top:1.25rem; color:var(--text-muted); font-size:0.9rem;">
      Demo account: <strong>demo</strong> / <strong>demo123</strong><br />
      No account? <a href="/register">Register here</a>
    </p>
  </div>
</div>
{% endblock %}
